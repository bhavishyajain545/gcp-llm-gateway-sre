# Scale on the work that actually matters for an LLM gateway: requests in flight
# per pod (each one holds a connection open to the provider for seconds), not
# CPU, which stays low while pods wait on the model. The metric is scraped by
# Managed Prometheus and served to the HPA by the custom-metrics-stackdriver-adapter.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|llm_inflight_requests|gauge
        target:
          type: AverageValue
          averageValue: "4"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
