# The load balancer health-checks "/" by default (404 here); point it at /healthz.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: llm-gateway
