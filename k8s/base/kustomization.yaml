apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-gateway
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - podmonitoring.yaml
  - gateway.yaml
  - healthcheckpolicy.yaml
  - backendpolicy.yaml
# CI updates newTag on every merge to main; `kubectl apply -k k8s/base` (deploy.sh rollout) applies it.
images:
  - name: us-central1-docker.pkg.dev/bj-llm-gateway/apps/llm-gateway
    newTag: v1
