# Workload Identity: this KSA is mapped to the GCP SA below (binding in terraform/iam.tf).
# The pod gets Vertex AI, Secret Manager and Cloud Trace access with no key file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-gateway
  annotations:
    iam.gke.io/gcp-service-account: llm-gateway@bj-llm-gateway.iam.gserviceaccount.com
